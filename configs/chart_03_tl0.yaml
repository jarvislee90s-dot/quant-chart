# 03 30年国债期货TL（TL0 日线）——reference/03 同款复刻
# 读图规范三步执行记录（zoom 证据见 out/refs/chart_03/，y 标定基于上位阶自洽系：
#   116.53@y312 / 110.32@y622 ⇒ ~50.0px/元，用 113.40@y469 复测=113.39（±1px≈0.02 元）自洽）：
#   116.53  顶线/顶药丸（橙 #f08a0a 线 + #fe9b00 药丸）：pill_top_6x.png 6x 放大逐字确认；
#           落在数据区间 [110.31×0.95, 117.59×1.05] ✓；与正文"116.5-117区间逢高试空"（004期 P11）一致
#   113.40  多空分割线/棕药丸（#703712 线 + #8c4210 药丸）：pill_mid_6x.png 确认 ✓；
#           与正文"9月第二目标113.5"同带，且落在 26-04~26-07 箱体 111.10-114.53 内 ✓
#   110.32  底线/青药丸（#3e7d7d 线 + #408080 药丸）：pill_bot_6x.png 确认 ✓；
#           交叉验证本批 TL0 数据窗口最低价 110.31（2026-03-23），线位仅差 1 跳（0.01）✓
#   区间价差310BP ×2（蓝 #0070b0，spread_blue_top/bot_4x.png 放大确认，两条同文）：
#           与相邻线差交叉验证 116.53−113.40=3.13、113.40−110.32=3.08，按国债价格一位小数口径
#           3.1×100=310BP 逐条吻合（计划 L3"价差标注==跨线间距±1"即按此口径断言）
#   周线级别下行通道：黄绿虚线 #74e602 成对、平行、斜率为负；右缘端点恰压 26-08 反弹带 ≈117
#           （rail117_green_4x.png：上轨右端与 116.53 药丸相接，"背靠通道上轨117做空"即指此）
#           ——本图窗口（25-09~26-08，241 根）为样张两年窗的后半段，通道走 channels 自动拟合
#           （fit_channel 全窗 2025-09-01→2026-08-28，tilt/press 默认）：斜率 -0.00221 <0，
#           上轨 117.60→117.07 压住窗口最高 117.59（2025-09-04）、右端 ≈117.07 与"上轨117"吻合，
#           下轨 110.59→110.06 托住 26-01-08 低点 110.40 并贴 26-03-23 低点 110.31，coverage=1.000
#   背靠通道上轨117做空（黄绿字 #8cc000 + 绿箭头指向通道上轨）：rail117_green_4x.png 确认
#   多空分割线（黄字 #c8c800 + 线下青绿↓箭头 + 线上红↑箭头）：duokong_4x.png 确认——
#           计划 L1 暂记"红字+绿箭头"，zoom 证实为黄字+双箭头（上红↑/下青绿↓），按样张复刻
#   BULL（橙红 #e05555）/BEAR（黄绿 #80c000）+ 红斜上箭头 + 红水平→箭头 + 绿下行箭头：
#           bullbear_4x.png 确认，均位于最后K线右侧预测区
#   30年国债期货TL（大红字 #e00000）：big_title_3x.png 确认；样张居下部空白区，
#           本图因 110.32 线以下画布仅 0.45 元（y 轴下界 109.87），置左下空白带（26-10 K 线下方）
#   白/灰趋势线：样张的灰白平滑曲线为跨两年窗的超长均线（窗口左侧需窗外数据才能算出），
#           本图以右段两点灰白趋势线 #7c828c 复刻其形态语义（26-01→26-08 缓降、压 1-3 月反弹上方、
#           8 月被价格上破——与样张右段行为一致）
#   第八轮（数据窗口扩至 24-09→26-08，482 根）：样张的 122.28 顶线/顶药丸与 108.61 低点价签
#           已可复刻——本批数据最高/最低恰为 122.28（2025-02-07）/108.61（2024-09-30），逐元一致 ✓
#   样张 26-04~26-08 红点状箱体（红 #e03030 虚线框 113.55-114.30，测得顶边 y424=114.29）为历史区
#   zone（非预测区，无裁剪风险）按样张保留；红点状上升虚线（26-03-23 低点 110.31 引出、托反弹低点
#   下方）以 trendline(dot) 复刻
#   样张 x 轴为合约切换非线性压缩（底部 TL2503…TL2612 标签与月份网格不对齐），元素绝对日期不可靠，
#   故蓝字/箭头等按"干净空白带 + 相对布局"落位（日期锚点优先，pos 仅用于右缘预测区 x≤244.5）
input:
  mode: daily_csv
  csv: data/tl0_daily.csv
  range: [2024-09-01, 2026-08-28]
project: out/projects/chart_03_tl0
strategy: daily_candle
forecast_days: 15                 # 第八轮：右缘预测区 15 个空白工作日（xaxis 右界 = 241+30+1.5 = 272.5）
title: "30年国债期货TL · 日线策略同款复刻"
params:
  ma: [5, 10, 20, 30, 60]          # 日线图 MA=字面 5/10/20/30/60 根（工作日语义）
  channels:
    # —— 周线级别下行通道：黄绿虚线成对，fit_channel 自动拟合（中枢主导三步法，tilt/press 默认） ——
    #    全窗 25-09-01→26-08-28：上轨压 26-08 背靠带 ≈117.1（同样张"背靠通道上轨117"）、下轨托 110.3-110.6 低点带
    - start: "2025-02-07"        # 第八轮：窗口扩至两年后，下行通道自峰值 122.28（2025-02-07）起拟合——
      end: "2026-08-28"          #   覆盖 25-02 冲顶→26-03 低点 110.31 全程，斜率更陡（同样张）
      color: "#74e602"             # 样张黄绿虚线取样
      dash: dash
      line_width: 1.2
  annotations:
    # —— 历史高/低点（第八轮两年窗回归）：122.28 顶线+顶药丸（粉，2025-02-07 峰）；108.61 低点价签（2024-09-30） ——
    - {type: hline, value: 122.28, color: "#f472b6", width: 1.2, dash: solid, axis: y}
    - {type: tag, value: 122.28, text: "122.28", color: "#f472b6", text_color: "#5a1030"}
    - {type: text, at: ["2024-10-15", 108.05], text: "108.61 ↓", size: 12, color: "#39d353"}
    # —— 三条水平线 + 右缘药丸（值=读图确认；线色取样样张线条、药丸底色取样药丸） ——
    - {type: hline, value: 116.53, color: "#f08a0a", width: 1.5, dash: solid, axis: y}
    - {type: hline, value: 113.40, color: "#703712", width: 1.5, dash: solid, axis: y}
    - {type: hline, value: 110.32, color: "#3e7d7d", width: 1.5, dash: solid, axis: y}
    - {type: tag, value: 116.53, text: "116.53", color: "#fe9b00", text_color: "#ffffff"}
    - {type: tag, value: 113.40, text: "113.40", color: "#8c4210", text_color: "#ffffff"}
    - {type: tag, value: 110.32, text: "110.32", color: "#408080", text_color: "#ffffff"}
    # —— 区间价差：红竖箭头×2（两端=相邻水平线，跨距 3.13/3.08≈一位小数口径 310BP）+ 蓝字×2 ——
    - {type: arrow, from: ["2026-01-13", 113.40], to: ["2026-01-13", 116.53], color: "#df0203", width: 3}
    - {type: arrow, from: ["2025-11-11", 110.32], to: ["2025-11-11", 113.40], color: "#df0203", width: 3}
    - {type: text, at: ["2025-12-24", 114.95], text: "区间价差310BP", size: 15, color: "#0070b0"}
    - {type: text, at: ["2025-10-28", 112.30], text: "区间价差310BP", size: 15, color: "#0070b0"}
    # —— 多空分割线（黄字 + 线上红↑ / 线下青绿↓，zoom 证实计划暂记"红字"实为黄字） ——
    - {type: text, at: ["2025-11-04", 113.12], text: 多空分割线, size: 15, color: "#c8c800"}
    - {type: arrow, from: ["2025-10-21", 113.55], to: ["2025-10-21", 113.78], color: "#d82818", width: 2.2}
    - {type: arrow, from: ["2025-10-21", 113.21], to: ["2025-10-21", 113.03], color: "#3f9d78", width: 2.2}
    # —— 背靠通道上轨117做空（黄绿字 + 绿箭头指向通道上轨右段 ≈117.1） ——
    - {type: text, at: ["2026-08-19", 118.30], text: "背靠通道上轨117<br>做空", size: 15, color: "#8cc000"}
    - {type: arrow, from: ["2026-08-24", 117.75], to: [241.0, 117.20], color: "#8cc000", width: 2.2}
    # —— 通道标签（亮绿大字，样张位于通道上轨中段上方；插件不透传 label_color，故用 text 原语放置） ——
    - {type: text, at: ["2026-03-06", 119.60], text: 周线级别下行通道, size: 20, color: "#00e000"}
    # —— 红点状箱体（26-04~26-08 盘整带 113.55-114.30，历史区 zone，非预测区无裁剪风险） ——
    - {type: zone, from: "2026-04-15", to: "2026-08-20", price: [113.55, 114.30],
       edgecolor: "#e03030", fillcolor: "rgba(0,0,0,0)", dash: dot, opacity: .95}
    # —— 红点状上升虚线（自 26-03-23 窗口低点 110.31 上方引出、托 26-04~26-08 反弹低点下方） ——
    - {type: trendline, from: ["2026-03-23", 110.35], to: ["2026-08-24", 113.60],
       color: "#d82020", width: 1.2, dash: dot}
    # —— 白/灰趋势线（样张灰白超长均线：两年窗全程缓降，自 24-10 高点带压向 26-08） ——
    - {type: trendline, from: ["2024-10-10", 117.60], to: ["2026-08-24", 113.70],
       color: "#7c828c", width: 1.1}
    # —— BULL（橙红+红斜上箭头穿 116.53 药丸）/ BEAR（黄绿+绿下行箭头）——第八轮：两年窗预测区
    #    x ∈ (481, 498.5)（15 个空白工作日），红斜上箭头自历史区末段扫至右缘（同样张长斜箭头构图）
    - {type: text, at: [495.0, 115.70], text: BULL, size: 17, color: "#e05555"}
    - {type: text, at: [495.0, 114.20], text: BEAR, size: 17, color: "#80c000"}
    - {type: arrow, from: [477.0, 113.70], to: [496.0, 117.40], color: "#e05555", width: 3.0}
    - {type: arrow, from: [481.0, 114.95], to: [487.0, 114.95], color: "#e03030", width: 2.2}
    - {type: arrow, from: [486.0, 115.30], to: [496.0, 112.90], color: "#80c000", width: 3.0}
    # —— 品种大字（大红 #e00000，两年窗内置左下空白带：24-10 上部，108.61 低点下方） ——
    - {type: text, at: ["2024-10-18", 108.00], text: "30年国债期货TL", size: 28, color: "#e00000"}
