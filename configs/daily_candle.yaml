input:
  mode: daily_csv
  csv: data/IM2612_15min.csv
  range: [2026-06-01, 2026-08-28]
strategy: daily_candle
title: "IM2612 合约 · 15分钟策略同款复刻（样板）"
params:
  ma: [5, 10, 20, 30, 60]
  channels:
    # —— 通道由 fit_channel 自动拟合（中枢主导三步法：中枢LSQ定角度位置→小角度倾斜→张合压摆动极值） ——
    # 黄色内通道：上行段 07-27 09:45→08-18 15:00（剔除其后的下跌段）
    - {start: "2026-07-27 09:45", end: "2026-08-18 15:00", color: "#fdfd52", dash: dash}
    # 绿色外层通道：更宽窗口 07-22→08-26
    - {start: "2026-07-22 09:45", end: "2026-08-26 15:00", color: "#39d353", dash: dash}
  annotations:
    # —— 三条水平线：底线6460.9(前低) / 中线6999.8(支撑) / 顶线7560(目标)，与右缘药丸成对 ——
    - {type: hline, value: 6460.9, color: "#7d7d01", width: 1.0, dash: solid}
    - {type: hline, value: 6999.8, color: "#e47b7c", width: 1.0, dash: solid}
    - {type: hline, value: 7560.0, color: "#8a4210", width: 1.1, dash: solid}
    # —— 区域：红实线框（筹码密集区）+ 红虚线框×2（8月建仓观察带） ——
    - {type: zone, from: "2026-06-01 10:00", to: "2026-07-10 15:00", price: [7520, 8400], edgecolor: "#ff0000", fillcolor: "rgba(0,0,0,0)", dash: solid, opacity: .95}
    - {type: zone, from: "2026-08-05 09:45", to: "2026-08-12 15:00", price: [7300, 7430], edgecolor: "#ff0000", fillcolor: "rgba(0,0,0,0)", opacity: .85}
    - {type: zone, from: "2026-08-14 09:45", to: "2026-08-25 15:00", price: [7050, 7180], edgecolor: "#ff0000", fillcolor: "rgba(0,0,0,0)", opacity: .85}
    # —— 圆圈①②③（8月三处压力区高点）+ ④（套住最后一根收盘） ——
    - {type: circle, at: ["2026-08-11 13:45", 7560], color: "#eeef4e", size: 20, label: "1"}
    - {type: circle, at: ["2026-08-17 15:00", 7658], color: "#eeef4e", size: 20, label: "2"}
    - {type: circle, at: ["2026-08-18 09:45", 7662], color: "#eeef4e", size: 20, label: "3"}
    - {type: circle, at: [1022.0, 7457], color: "#eeef4e", size: 20, label: "4"}
    # —— 引线：区间宽度箭头×2，分别对应相邻两条水平线的间距 ——
    - {type: arrow, from: [514.0, 6999.8], to: [514.0, 7560.0], color: "#f21010", width: 3.2}
    - {type: arrow, from: [882.0, 6460.9], to: [882.0, 6999.8], color: "#f21010", width: 3.2}
    # —— 走势预演（08-28收盘右侧腾出2个工作日=32根预测区）：三情形两段折线，均先下后上 ——
    - {type: trendline, from: [1022.0, 7456.8], to: [1038.0, 7380.0], color: "#f04a4a", width: 2.2}
    - {type: trendline, from: [1038.0, 7380.0], to: [1054.0, 7560.0], color: "#f04a4a", width: 2.2}
    - {type: trendline, from: [1022.0, 7456.8], to: [1038.0, 7180.0], color: "#f5b800", width: 2.2}
    - {type: trendline, from: [1038.0, 7180.0], to: [1054.0, 7280.0], color: "#f5b800", width: 2.2}
    - {type: trendline, from: [1022.0, 7456.8], to: [1042.0, 6999.8], color: "#74cf00", width: 2.2}
    - {type: trendline, from: [1042.0, 6999.8], to: [1054.0, 7080.0], color: "#74cf00", width: 2.2}
    # —— 文字：品种大字 / 高低点价签 / 区间宽度 / 预演标签 / 区块名 ——
    - {type: text, at: [430.0, 8250], text: "IM2612 合约", size: 19, color: "#f02020"}
    - {type: text, at: [300.0, 8390], text: "8350.0 →", size: 10.5, color: "#e4e7eb"}
    - {type: text, at: [500.0, 6400], text: "6456.6 ↓", size: 10.5, color: "#39d353"}
    - {type: text, at: [470.0, 7240], text: "区间宽度560点", size: 12, color: "#f21010"}
    - {type: text, at: [890.0, 6690], text: "区间宽度539点", size: 12, color: "#f21010"}
    - {type: text, at: [1046.0, 7580], text: BULL, size: 13, color: "#f04a4a"}
    - {type: text, at: [1046.0, 7300], text: BASE, size: 13, color: "#f5b800"}
    - {type: text, at: [1046.0, 7040], text: BEAR, size: 13, color: "#74cf00"}
    - {type: text, at: [60.0, 8250], text: 筹码密集区, size: 21, color: "#e02020"}
    - {type: text, at: ["2026-08-07 10:30", 7455], text: 左侧建仓区间1, size: 11.5, color: "#e0312f"}
    - {type: text, at: ["2026-08-18 10:30", 7215], text: 左侧建仓区间2, size: 11.5, color: "#e0312f"}
    # —— 右缘药丸（目标 / 支撑 / 前低，与三条水平线同色系成对） ——
    - {type: tag, value: 7560.0, text: "7560", color: "#8c4210", text_color: "#f0e0c0"}
    - {type: tag, value: 6999.8, text: "6999.8", color: "#ff8888", text_color: "#8c1d1d"}
    - {type: tag, value: 6460.9, text: "6460.9", color: "#808000", text_color: "#e0bc37"}