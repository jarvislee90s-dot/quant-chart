# 02 沪铜主力合约（CU0 日线）——reference/02 同款复刻
# 读图规范三步执行记录（zoom 证据见 out/refs/chart_02/，y 标定基于上位阶自洽系：
#   粉线 105431@237.5px、棕线 112548@54px ⇒ 上部 ~38.8元/px；下部 85000@760px / 78000@928px ⇒ ~41.7元/px，
#   两段斜率不一致 ⇒ 样张为上下两截拼接截图，故像素仅用于相对定位，数值一律以读数+报告正文为准）：
#   112548  顶线/顶药丸（棕）：pill_top_8x.png 8x 放大逐字确认；落在数据区间 [79400×0.95, 114160×1.05] ✓
#   105431  当前价线/粉药丸：pill_mid_8x.png 8x 确认 ✓
#   98515   绿线/绿药丸：pill_green_8x.png 8x 确认 ✓
#   91558   黄线/黄药丸：pill_yellow_8x.png 8x 确认 ✓
#   区间宽度6916元 / 6957元：spread_6916/6957_zone_3x.png 放大确认（蓝色，非计划暂记的"红字"——
#           zoom 证据为蓝 #0070b0）；交叉验证 105431−98515=6916、98515−91558=6957，与两条红竖箭头
#           跨距精确相等（逐元不差）✓——四条线位阶互相咬合，读数可信
#   114160  历史峰值价签（红字+灰白小箭头指向 26-01-30 天量长影线）：topleft_114160_4x.png 确认；
#           本批 CU0 数据最高价恰为 114160.0（2026-01-30），逐元一致 ✓
#   黄圈×4（"前期四次假突破"）：circle1/2/3/4_6x.png 放大确认，圈心均贴 105431 线（最大偏 15.5px≈600元），
#           对应本批数据四次上破 105431 后收回：01-30（收 103680）、05-12（05-15 收 104710）、
#           06-02/03（06-04 起 收回）、07-16/17（突破前最后回踩）
#   白色长上升趋势线：整幅只在下部空白区一条（无黄绿虚线通道对——与 01/03 不同，本图无通道），
#           像素拟合 y=−0.4025x+1023.3，即自 (pos≈110, ≈83.7k) 升至 (pos≈236, ≈96.4k)，全程位于价格带下方
#   颈线红箭头：自"1"点（2026-05-13 峰 108900）水平向右至画布右缘（red_arrow_c4_3x.png）
#   计划 L1 暂记"水平线×3+药丸×3（红/绿/黄）"：zoom 证实实为 4 条+4 药丸（棕/粉/绿/黄），按样张复刻 4 条
input:
  mode: daily_csv
  csv: data/cu0_daily.csv
  range: [2025-09-01, 2026-08-28]
strategy: daily_candle
title: "沪铜主力合约 · 日线策略同款复刻"
forecast_days: 15                 # 第八轮：右缘预测区 15 个空白工作日（BULL/BEAR 预演舒展）
params:
  ma: [5, 10, 20, 30, 60]          # 日线图 MA=字面 5/10/20/30/60 根（工作日语义）
  annotations:
    # —— 四条水平线 + 右缘药丸（值=读图确认；线色取样样张线条、药丸底色取样药丸） ——
    - {type: hline, value: 112548, color: "#6b3a14", width: 1.2, dash: solid, axis: y}
    - {type: hline, value: 105431, color: "#e07070", width: 1.2, dash: solid, axis: y}
    - {type: hline, value: 98515,  color: "#069106", width: 1.2, dash: solid, axis: y}
    - {type: hline, value: 91558,  color: "#565a0c", width: 1.2, dash: solid, axis: y}
    - {type: tag, value: 112548, text: "112548", color: "#9c4210", text_color: "#ffffff"}
    - {type: tag, value: 105431, text: "105431", color: "#ff8890", text_color: "#ffffff"}
    - {type: tag, value: 98515,  text: "98515",  color: "#26b500", text_color: "#ffffff"}
    - {type: tag, value: 91558,  text: "91558",  color: "#868000", text_color: "#ffffff"}
    # —— 黄圈×4（"前期四次假突破"标记，圈心贴 105431 线；日期锚=各次假突破K线） ——
    - {type: circle, at: ["2026-01-30", 105431], color: "#f5d321", size: 30}
    - {type: circle, at: ["2026-05-12", 105650], color: "#f5d321", size: 30}
    - {type: circle, at: ["2026-06-03", 106000], color: "#f5d321", size: 30}
    - {type: circle, at: ["2026-07-17", 105150], color: "#f5d321", size: 30}
    # —— 蓝字×2（形态说明）+ 蓝箭头×4（分别指向四个黄圈，样张 zoom 确认） ——
    - {type: text, at: ["2026-04-23", 110950], text: "前期四次假突破，最长不超过4个交易日", size: 15, color: "#0b7ec2"}
    - {type: text, at: ["2026-08-04", 110800], text: "本轮突破后已持续2周不破位", size: 15, color: "#0b7ec2"}
    - {type: arrow, from: ["2026-02-26", 110300], to: ["2026-02-06", 106400], color: "#0b7ec2", width: 2}
    - {type: arrow, from: ["2026-05-06", 110000], to: ["2026-05-11", 106100], color: "#0b7ec2", width: 2}
    - {type: arrow, from: ["2026-07-07", 110300], to: ["2026-06-01", 106450], color: "#0b7ec2", width: 2}
    - {type: arrow, from: ["2026-07-28", 110300], to: ["2026-07-15", 106050], color: "#0b7ec2", width: 2}
    # —— 区间价差：红竖箭头×2（两端=相邻水平线，跨距 6916/6957 与标注精确相等）+ 蓝字×2 ——
    - {type: arrow, from: ["2026-08-12", 98515], to: ["2026-08-12", 105431], color: "#df0203", width: 3}
    - {type: arrow, from: ["2026-07-24", 91558], to: ["2026-07-24", 98515],  color: "#df0203", width: 3}
    - {type: text, at: ["2026-07-29", 101100], text: "区间宽度6916元", size: 15, color: "#0b7ec2"}
    - {type: text, at: ["2026-07-17", 96000],  text: "区间宽度6957元", size: 15, color: "#0b7ec2"}
    # —— 红字形态说明×2 行（样张红色双行："黄色箭头趋势符合 / 杯柄突破形态特征"） ——
    - {type: text, at: ["2026-04-30", 94400], text: "黄色箭头趋势符合", size: 17, color: "#e00505"}
    - {type: text, at: ["2026-04-30", 92800], text: "杯柄突破形态特征", size: 17, color: "#e00505"}
    # —— 黄色箭头×5（第八轮算法化：按样张判定上升/下降通道段，逐段 fit_channel 取下边缘作箭头；
    #    时间区隔：前一支箭头的终点之后才是下一支的起点——S1末101=S2起101、S2末137=S3起137…） ——
    #    S1 上升(25-09→26-01峰114160) / S2 下降(→03-31低91500) / S3 上升(→05-20高108900) /
    #    S4 回踩(→07-17低101640) / S5 突破(→08-28 重上粉线105431)
    - {type: arrow, from: [0.0,   70197.0],  to: [101.0, 98726.0], color: "#f0f000", width: 2.5}
    - {type: arrow, from: [101.0, 98871.0],  to: [137.0, 88396.0], color: "#f0f000", width: 2.5}
    - {type: arrow, from: [137.0, 94159.0],  to: [169.0, 102995.0], color: "#f0f000", width: 2.5}
    - {type: arrow, from: [169.0, 101999.0], to: [210.0, 99541.0],  color: "#f0f000", width: 2.5}
    - {type: arrow, from: [210.0, 102869.0], to: [240.0, 106799.0], color: "#f0f000", width: 2.5}
    # —— 颈线红箭头（自"1"点 2026-05-13 峰 108900 水平向右）+ 序号 1/2/3/4（四个测试点高点）+ 红色下行指针 ——
    - {type: arrow, from: ["2026-05-13", 108800], to: [242.5, 108800], color: "#e04040", width: 3.5}
    - {type: text, at: ["2026-05-13", 109550], text: "1", size: 16, color: "#e0a412"}
    - {type: text, at: ["2026-08-11", 109300], text: "2", size: 16, color: "#e0a412"}
    - {type: text, at: ["2026-08-20", 109300], text: "3", size: 16, color: "#e0a412"}
    - {type: text, at: ["2026-08-27", 109300], text: "4", size: 16, color: "#e0a412"}
    - {type: arrow, from: ["2026-07-17", 108640], to: ["2026-07-28", 106100], color: "#e04040", width: 2.2}
    # —— BULL（红字+红↑）/ BEAR（黄绿字+绿V 两段）——第八轮：预测区加宽至 15 个工作日
    #    （xaxis 右界 = n_all(241)+15×1+1.5 = 257.5），预演舒展（回踩约+5日、目标约+14日）
    - {type: text, at: [256.0, 111200], text: BULL, size: 18, color: "#e04040"}
    - {type: text, at: [256.0, 105200], text: BEAR, size: 18, color: "#80c000"}
    - {type: arrow, from: [242.0, 109200], to: [254.0, 113300], color: "#e04040", width: 3.0}
    - {type: arrow, from: [242.0, 108760], to: [249.0, 103600], color: "#80c000", width: 3.0}
    - {type: arrow, from: [249.0, 103600], to: [255.0, 106300], color: "#80c000", width: 3.0}
    # —— 白色长上升趋势线（样张唯一一条，全程位于价格带下方的空白区；无通道，见头注） ——
    - {type: trendline, from: ["2026-02-12", 83700], to: ["2026-08-24", 96400], color: "#8b929a", width: 1.1}
    # —— 历史峰值价签（红字 114160 + 灰白小箭头指向 26-01-30 峰值K线上方；本批数据逐元一致） ——
    - {type: arrow, from: ["2026-01-21", 113400], to: ["2026-01-30", 114250], color: "#9aa0a6", width: 1.2,
       text: "114160", text_color: "#f52630", text_size: 15, text_position: "top left"}
    # —— 品种大字（红 #e60000，样张位于 26-04 下部空白区，不压 K 线密集区） ——
    - {type: text, at: ["2026-04-23", 82800], text: 沪铜主力合约, size: 30, color: "#e60000"}
